[package]
name = "re-edit"
version = "0.1.0"
description = "Offline Markdown editor for the Linux desktop"
authors = ["Caff-Core"]
license = "MIT"
repository = "https://github.com/Caff-Core/re-edit"
edition = "2024"
rust-version = "1.90"

[lib]
name = "re_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
libc = "0.2"
base64 = "0.22"
notify = "8"

[dev-dependencies]
tempfile = "3"
