name: Bug
description: Something does not work as specified
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build and environment
      description: Commit or package version, and OS (for example Fedora 44, GNOME).
    validations:
      required: true
